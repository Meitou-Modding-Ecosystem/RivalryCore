name: CI
'on':
  workflow_dispatch: null
  pull_request:
    branches:
    - beta
    - main
    - release
  push:
    branches:
    - beta
    - main
    - release
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    uses: TheIvoryDisaster/GutenStructure/.github/workflows/build-dotnet.yml@29fefc59172e5427e6bbf7ef5ba1741f7fe64daa
  development-readiness:
    name: Development readiness
    if: always()
    needs:
    - build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Require prerequisite checks
      env:
        RESULTS: ${{ toJSON(needs) }}
        TARGET: ${{ github.base_ref || github.ref_name }}
      run: "python - <<'PYCODE'\nimport json, os\nresults = json.loads(os.environ['RESULTS'])\nrequired = list(results)\n\
        if not required or any(results[key]['result'] != 'success' for key in required):\n    raise SystemExit('A prerequisite\
        \ failed, was cancelled, or was skipped')\nPYCODE\n"
  upstream-compatibility:
    uses: TheIvoryDisaster/GutenStructure/.github/workflows/upstream-compatibility.yml@29fefc59172e5427e6bbf7ef5ba1741f7fe64daa
  package-validation:
    uses: TheIvoryDisaster/GutenStructure/.github/workflows/package-validation.yml@29fefc59172e5427e6bbf7ef5ba1741f7fe64daa
    with:
      mod-folder: RivalryCore
      empty-data-mod: true
  release-readiness:
    name: Release readiness
    if: always()
    needs:
    - development-readiness
    - upstream-compatibility
    - package-validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Require prerequisite checks
      env:
        RESULTS: ${{ toJSON(needs) }}
        TARGET: ${{ github.base_ref || github.ref_name }}
      run: "python - <<'PYCODE'\nimport json, os\nresults = json.loads(os.environ['RESULTS'])\ntarget = os.environ['TARGET']\n\
        required = list(results) if target == 'release' else ['development-readiness']\nif not required or any(results[key]['result']\
        \ != 'success' for key in required):\n    raise SystemExit('A prerequisite failed, was cancelled, or was skipped')\n\
        PYCODE\n"
