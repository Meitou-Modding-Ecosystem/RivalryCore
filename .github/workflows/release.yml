# Releases one mod: a tag <slug>-v<version> (rivalry-core-v0.2.0) builds that mod, checks the version against its meitou.json, and publishes
# <Mod>-<version>.zip (with its SHA-256) holding the folder to drop into Kenshi/mods/. Packaging: GutenStructure package-meitou-mod.yml (pinned).
name: Release

on:
  push:
    tags: ["*-v*"]

permissions:
  contents: read

jobs:
  release-gate:
    permissions:
      contents: read
    uses: TheIvoryDisaster/GutenStructure/.github/workflows/release-gate.yml@2136f4ee8e7c9461d635a3960d10c68d06dde893

  mod:
    needs: release-gate
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.mod.outputs.slug }}
      folder: ${{ steps.mod.outputs.folder }}
      empty-data-mod: ${{ steps.mod.outputs.empty }}
    steps:
      - name: Mod for the tag
        id: mod
        env:
          TAG: ${{ github.ref_name }}
        run: |
          echo "slug=${TAG%-v*}" >> "$GITHUB_OUTPUT"
          # Tag slug -> mod folder and whether it ships an empty .mod (a code mod without data). Add a line per mod.
          case "${TAG%-v*}" in
            rivalry-core) echo "folder=RivalryCore" >> "$GITHUB_OUTPUT"; echo "empty=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "no mod for tag '$TAG'" >&2; exit 1 ;;
          esac

  release:
    needs: [mod, release-gate]
    permissions:
      contents: write
    uses: TheIvoryDisaster/GutenStructure/.github/workflows/package-meitou-mod.yml@2136f4ee8e7c9461d635a3960d10c68d06dde893
    with:
      mod-folder: ${{ needs.mod.outputs.folder }}
      slug: ${{ needs.mod.outputs.slug }}
      channel: release
      test-project: .
      empty-data-mod: ${{ needs.mod.outputs.empty-data-mod == 'true' }}
