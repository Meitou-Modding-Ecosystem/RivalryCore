# Releases one mod: every push to release reads Rivalry Core's version from its meitou.json and, unless the tag <slug>-v<version>
# (rivalry-core-v0.2.0) exists, creates that tag at the release head and publishes <Mod>-<version>.zip (with its SHA-256) holding the folder
# to drop into Kenshi/mods/, all in one run. A hand-pushed tag (tools/Tag-Release.ps1) releases the mod it names, as a fallback. Packaging:
# GutenStructure package-meitou-mod.yml (pinned).
name: Release

on:
  push:
    branches: [release]
    tags: ["*-v*"]

permissions:
  contents: read

jobs:
  release-gate:
    permissions:
      contents: read
    uses: TheIvoryDisaster/GutenStructure/.github/workflows/release-gate.yml@5dc76952e11014b8c75699f474734c4e444eb5ea

  mod:
    needs: release-gate
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.mod.outputs.slug }}
      folder: ${{ steps.mod.outputs.folder }}
      empty-data-mod: ${{ steps.mod.outputs.empty }}
    steps:
      - name: Mod for the tag or branch
        id: mod
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # A tag names its mod; a push to release releases Rivalry Core.
          slug=rivalry-core
          if [ "$GITHUB_REF_TYPE" = tag ]; then slug="${TAG%-v*}"; fi
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          # Tag slug -> mod folder and whether it ships an empty .mod (a code mod without data). Add a line per mod.
          case "$slug" in
            rivalry-core) echo "folder=RivalryCore" >> "$GITHUB_OUTPUT"; echo "empty=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "no mod for tag '$TAG'" >&2; exit 1 ;;
          esac

  release:
    needs: [mod, release-gate]
    permissions:
      contents: write
    uses: TheIvoryDisaster/GutenStructure/.github/workflows/package-meitou-mod.yml@5dc76952e11014b8c75699f474734c4e444eb5ea
    with:
      mod-folder: ${{ needs.mod.outputs.folder }}
      slug: ${{ needs.mod.outputs.slug }}
      channel: release
      test-project: .
      empty-data-mod: ${{ needs.mod.outputs.empty-data-mod == 'true' }}
