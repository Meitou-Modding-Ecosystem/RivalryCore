name: Bug
description: A mod misbehaves, crashes or breaks a save.
labels: [bug]
body:
  - type: dropdown
    id: mod
    attributes:
      label: Mod
      options: [Rivalry Core, Other / not sure]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Mod version (meitou.json) and Meitou version.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Save, data-mod load order, what you did.
  - type: textarea
    id: log
    attributes:
      label: Log
      description: The relevant part of Meitou's log.txt.
      render: text
